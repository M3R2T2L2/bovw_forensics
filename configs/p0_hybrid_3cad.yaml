# Preregistered test of the 75/25 hybrid memory on 3CAD (docs/preregistration_hybrid_3cad.md).
# Codebook and coreset baselines are rerun here on the same features and seeds.
# Primary image score: max patch score (image_auroc). Runtime (T4): about 4-5 h
# (3CAD feature extraction about 3 h, then k-means). Features are cached on the Colab
# disk; finished runs are saved to Drive, so rerun to resume.

name: p0_hybrid_3cad

data:
  name: 3cad
  root: /content/3cad
  categories: all
  size: 448
  mask_size: 256

cache_dir: /content/cache_3cad
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractors:
  - name: dinov2_s
    params: {image_size: 448, batch_size: 32}

normalize: true
smoothing_sigma: 4
region_metrics: true
image_topk: [1, 3, 10, 30]
cache_vocab: true
low_memory: true
require_gpu: true

methods:
  codebook:
    k: [256, 1024]
    scores: [codebook_dist]
  subsample:
    sizes: [256, 1024]
    methods: [coreset_knn]
  hybrid:
    sizes: [256, 1024]
    word_fractions: [0.75]

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
