# Referee report, round 2: the uniform random sample of real patches as a memory, with AUPRO, so the
# codebook-vs-coreset gap can be split into "k-means is good" and "greedy k-center is a poor choice at small M".
# Same features, seeds, sizes and scoring as p0_anomaly_visa (codebook and coreset rows are taken from there).
# Exploratory. Runtime on a Colab T4: about 30 min (cached features).

name: p0_random_visa

data:
  name: visa
  root: /content/visa
  categories: all
  size: 448
  mask_size: 256

cache_dir: /content/drive/MyDrive/bovw-forensics/cache
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractors:
  - name: dinov2_s
    params: {image_size: 448, batch_size: 32}

normalize: true
smoothing_sigma: 4
region_metrics: true
image_topk: [1, 3, 10, 30]
cache_vocab: true
low_memory: false
require_gpu: true

methods:
  subsample:
    sizes: [64, 256, 1024]
    methods: [random_knn]

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
