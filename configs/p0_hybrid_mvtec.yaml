# Hybrid memory (exploratory): M = K words + M - K real patches in ONE memory bank.
# Words: spherical k-means (as the codebook). Patches: greedy k-center started from
# the words, so it picks the normal patches the words cover worst (residual coreset).
# Compared with codebook and coreset results from p0_anomaly_mvtec_v2 (same features, seeds, scores).
#
# Reuses cached DINOv2-S features and metadata on Drive: no dataset download needed.
# Settings below must match p0_anomaly_mvtec_v2 so the caches hit. Exploratory: designed after
# seeing MVTec/VisA results; a confirmatory test should be preregistered (e.g. 3CAD).

name: p0_hybrid_mvtec

data:
  name: mvtec
  root: /content/mvtec
  categories: all
  size: 448
  mask_size: 256

cache_dir: /content/drive/MyDrive/bovw-forensics/cache
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractors:
  - name: dinov2_s
    params: {image_size: 448, batch_size: 32}

normalize: true
smoothing_sigma: 4
region_metrics: true
image_topk: [1, 3, 10, 30]
cache_vocab: true
require_gpu: true

methods:
  hybrid:
    sizes: [64, 256, 1024]
    word_fractions: [0.5, 0.75]  # 0.5 already done is skipped on rerun

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
