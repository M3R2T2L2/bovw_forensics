# Referee-report control for defect-type discovery (exploratory): top-10 patches chosen by
# the codebook, the full bank and the coreset (M = K = 1,024), and the number of clusters
# chosen by silhouette (oracle_estk) instead of given. Reuses cached features and vocabularies.

name: p0_review_discovery_mvtec

data:
  name: mvtec
  root: /content/mvtec
  categories: all
  size: 448
  mask_size: 256

cache_dir: /content/drive/MyDrive/bovw-forensics/cache
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractor:
  name: dinov2_s
  params: {image_size: 448, batch_size: 32}

normalize: true
k: [1024]
topk: 10
drop_types: [combined]
algorithms: [kmeans]
settings: [oracle, oracle_estk]
selectors: [codebook, fullbank, coreset]

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
