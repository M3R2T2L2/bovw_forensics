# P0 task 3, replication on 3CAD (8 categories), preregistered.
# See docs/preregistration_3cad.md: settings and predictions are fixed before the run.
#
# 3CAD: Yang et al., AAAI 2025; no licence stated (research use; confirm with authors).
# ~27k images; features are too large for Drive (~20 GB), so they are cached on the
# Colab disk. Finished runs are saved to Drive; after a disconnect, rerun to resume
# (unfinished categories re-extract features).
# Runtime on a Colab T4: about 3-4 h (full-bank kNN on ~2M-patch banks dominates).

name: p0_anomaly_3cad

data:
  name: 3cad
  root: /content/3cad          # the notebook resolves the extracted archive root
  categories: all
  size: 448
  mask_size: 256

cache_dir: /content/cache_3cad
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractors:
  - name: dinov2_s
    params: {image_size: 448, batch_size: 32}

normalize: true
smoothing_sigma: 4
region_metrics: true
image_topk: [1, 3, 10, 30]     # primary: 10 (preregistered)
cache_vocab: true
low_memory: true

methods:
  patch_knn: {}
  codebook:
    k: [64, 256, 1024]
    scores: [codebook_dist]
  subsample:
    sizes: [64, 256, 1024]
    methods: [coreset_knn]

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
