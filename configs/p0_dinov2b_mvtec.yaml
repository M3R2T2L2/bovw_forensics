# Second backbone (referee report): DINOv2-B (768-d) instead of DINOv2-S, mvtec, same protocol as the
# DINOv2-S runs (448 px, M = K in {64, 256, 1024}, 3 seeds). Exploratory: not preregistered.
# Runtime on a Colab T4: about 2-3 h (feature extraction about 45 min). Finished runs are saved to Drive;
# after a disconnect, Run all again (categories whose features were only on the Colab disk re-extract).

name: p0_dinov2b_mvtec

data:
  name: mvtec
  root: /content/mvtec          # the notebook resolves the extracted archive root
  categories: all
  size: 448
  mask_size: 256

cache_dir: /content/drive/MyDrive/bovw-forensics/cache
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractors:
  - name: dinov2_b
    params: {image_size: 448, batch_size: 16}

normalize: true
smoothing_sigma: 4
region_metrics: true
image_topk: [1, 3, 10, 30]
cache_vocab: true
low_memory: false
require_gpu: true

methods:
  patch_knn: {}
  codebook:
    k: [64, 256, 1024]
    scores: [codebook_dist]
  subsample:
    sizes: [64, 256, 1024]
    methods: [coreset_knn]

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
