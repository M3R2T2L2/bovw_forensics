# Control for the DINOv2-B max-score collapse at K = 64 on MVTec (codebook image AUROC 0.72 vs. 0.93 for the
# coreset, while top-10 and localization were fine). Hypothesis: DINOv2-B's high-norm artifact tokens
# (Darcet et al., "Vision Transformers Need Registers", ICLR 2024) appear in normal images, are rare, and are
# not covered by 64 centroids, so a normal image's single worst patch scores high. DINOv2-B with registers
# removes most artifact tokens; if the hypothesis holds, the codebook's max-score detection recovers at K = 64.
# Same protocol as p0_dinov2b_mvtec; exploratory. Runtime on a Colab T4: about 2 h.

name: p0_dinov2breg_mvtec

data:
  name: mvtec
  root: /content/mvtec          # the notebook resolves the extracted archive root
  categories: all
  size: 448
  mask_size: 256

cache_dir: /content/drive/MyDrive/bovw-forensics/cache
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractors:
  - name: dinov2_b_reg
    params: {image_size: 448, batch_size: 16}

normalize: true
smoothing_sigma: 4
region_metrics: true
image_topk: [1, 3, 10, 30]
cache_vocab: true
low_memory: false
require_gpu: true

methods:
  # full bank skipped (already run with DINOv2-B)
  codebook:
    k: [64, 256, 1024]
    scores: [codebook_dist]
  subsample:
    sizes: [64, 256, 1024]
    methods: [coreset_knn]

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
