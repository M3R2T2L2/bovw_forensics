# Torch-free smoke test: runs in well under a minute on CPU.
name: smoke_synthetic

dataset:
  name: synthetic
  n_per_class: 30
  n_classes: 4

cache_dir: ./.cache/features
results_dir: ./results

extractors:
  - name: dense_sift
    params: {resize: 96, step: 8, size: 16}
  - name: orb
    params: {resize: 224, max_kp: 300}
    encode: {soft: {knn: 3}}

vocab:
  k: [16, 64]
  seeds: [0, 1]
  max_descriptors: 50000

assignments: [hard, soft, vlad]
vlad_max_k: 64

encode:
  soft: {knn: [3, 5], sigma_scale: [0.5, 1.0]}

eval:
  clustering: {pca_dim: 32, seeds: [0, 1]}
