# 3CAD at higher input resolution (referee report: possible floor effect at 448 px).
# 560 px = 40 x 40 patch grid (1.56x the patches of 448 px); DINOv2-S as in the main run.
# 672 px (48 x 48) was considered but would need ~45 GB of local features and about 10-15 h of extraction.
# Full bank skipped (cost). Exploratory: not preregistered.
# Runtime on a Colab T4: about 6-8 h, mostly feature extraction; finished categories are saved to Drive,
# an interrupted category re-extracts.

name: p0_3cad_hires

data:
  name: 3cad
  root: /content/3cad
  categories: all
  size: 560
  mask_size: 256

cache_dir: /content/cache_3cad_hires
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractors:
  - name: dinov2_s
    params: {image_size: 560, batch_size: 16}

normalize: true
smoothing_sigma: 4
region_metrics: true
image_topk: [1, 3, 10, 30]
cache_vocab: true
low_memory: true
require_gpu: true

methods:
  codebook:
    k: [64, 256, 1024]
    scores: [codebook_dist]
  subsample:
    sizes: [64, 256, 1024]
    methods: [coreset_knn]

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
