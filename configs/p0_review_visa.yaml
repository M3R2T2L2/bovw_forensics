# Referee-report controls on visa (exploratory; reuses cached DINOv2-S features and vocabularies
# from p0_anomaly_visa, so no dataset download). Codebook and coreset are rerun here for in-run comparisons.
#   medoid_knn      real patch nearest each k-means word (separates averaging from placement)
#   coreset_trimN   greedy k-center after dropping the N% most isolated training patches
#   codebook_gpu    Lloyd k-means on the GPU, needed for K = 4,096 and 16,384 (calibrated at 1,024)
#   large M         coreset and codebook_gpu at M = 4,096 and 16,384
#   extra_metrics   smoothing sigma in {0, 2, 8} and AUPRO at 5% / 10% FPR for selected runs

name: p0_review_visa

data:
  name: visa
  root: /content/visa
  categories: all
  size: 448
  mask_size: 256

cache_dir: /content/drive/MyDrive/bovw-forensics/cache
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractors:
  - name: dinov2_s
    params: {image_size: 448, batch_size: 32}

normalize: true
smoothing_sigma: 4
region_metrics: true
image_topk: [1, 3, 10, 30]
cache_vocab: true
require_gpu: true

extra_metrics:
  methods: [codebook_dist, coreset_knn, medoid_knn]
  k: [64, 1024]
  sigmas: [0, 2, 8]
  aupro_fpr: [0.05, 0.1]

methods:
  codebook:
    k: [64, 256, 1024]
    scores: [codebook_dist, medoid_knn]
  codebook_gpu:
    k: [1024, 4096, 16384]
  subsample:
    sizes: [64, 256, 1024, 4096, 16384]
    methods: [coreset_knn, coreset_trim1, coreset_trim5]

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
