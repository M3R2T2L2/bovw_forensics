# 3CAD with aspect-preserving resizing and a cleaned training set (notebook 12 findings).
#   pad_square:  pad each image (and mask) to a square with black borders before resizing to 448 px,
#                instead of stretching (most categories mix shapes such as 1024x352 and 500x1024)
#   dedup_train: drop byte-identical duplicate training images and training images that also appear in
#                test (14 duplicates and 5 leaked images in Aluminum_Camera_Cover; none elsewhere)
# DINOv2-S, 448 px, codebook vs. coreset, M = K in {64, 256, 1024}, 3 seeds; full bank skipped.
# Exploratory: not preregistered. Runtime on a Colab T4: about 4 h (feature extraction about 3 h).

name: p0_3cad_pad

data:
  name: 3cad
  root: /content/3cad
  categories: all
  size: 448
  mask_size: 256
  pad_square: true
  dedup_train: true

cache_dir: /content/cache_3cad_pad
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractors:
  - name: dinov2_s
    params: {image_size: 448, batch_size: 32}

normalize: true
smoothing_sigma: 4
region_metrics: true
image_topk: [1, 3, 10, 30]
cache_vocab: true
low_memory: true
require_gpu: true

methods:
  codebook:
    k: [64, 256, 1024]
    scores: [codebook_dist]
  subsample:
    sizes: [64, 256, 1024]
    methods: [coreset_knn]

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
