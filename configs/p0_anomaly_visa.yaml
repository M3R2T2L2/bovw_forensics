# P0 task 3, replication on VisA (12 categories), preregistered.
# See docs/preregistration_visa.md: settings and predictions are fixed before the run.
#
# VisA: Zou et al., ECCV 2022, CC BY 4.0. Official 1-class split (vendored).
# Runtime on a Colab T4: about 2 h (k-means on CPU dominates), plus a one-time
# ~1.8 GB download to Drive. Every finished run is saved; rerun to resume.

name: p0_anomaly_visa

data:
  name: visa
  root: /content/visa          # the notebook resolves the extracted archive root
  categories: all
  size: 448
  mask_size: 256

cache_dir: /content/drive/MyDrive/bovw-forensics/cache
results_dir: /content/drive/MyDrive/bovw-forensics/results

extractors:
  - name: dinov2_s
    params: {image_size: 448, batch_size: 32}

normalize: true
smoothing_sigma: 4
region_metrics: true
image_topk: [1, 3, 10, 30]     # primary: 10 (preregistered)
cache_vocab: true

methods:
  patch_knn: {}
  codebook:
    k: [64, 256, 1024]
    scores: [codebook_dist]
  subsample:
    sizes: [64, 256, 1024]
    methods: [coreset_knn]

vocab:
  seeds: [0, 1, 2]
  max_descriptors: 200000
  spherical: true
